name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build whats-it-worth app
        run: |
          cd whats-it-worth
          npm ci
          npm run build
          cp api.php dist/

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DREAMHOST_SSH_KEY }}

      - name: Add DreamHost to known hosts
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_PORT: ${{ secrets.DREAMHOST_PORT }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$DREAMHOST_HOST" ]; then
            ssh-keyscan -p "${DREAMHOST_PORT:-22}" -H "$DREAMHOST_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy website files to DreamHost
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_PORT: ${{ secrets.DREAMHOST_PORT }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          DREAMHOST_WEB_ROOT: ${{ secrets.DREAMHOST_WEB_ROOT }}
        run: |
          test -n "$DREAMHOST_HOST"
          test -n "$DREAMHOST_USER"
          test -n "$DREAMHOST_WEB_ROOT"
          ssh -o BatchMode=yes -p "${DREAMHOST_PORT:-22}" \
            "$DREAMHOST_USER@$DREAMHOST_HOST" \
            "test -d '$DREAMHOST_WEB_ROOT' && mkdir -p '$DREAMHOST_WEB_ROOT/assets'"
          rsync -avz --delete \
            -e "ssh -p ${DREAMHOST_PORT:-22}" \
            index.html \
            app.js \
            data.js \
            spotify-api.php \
            styles.css \
            service-worker.js \
            manifest.webmanifest \
            renterscottage \
            "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_WEB_ROOT/"
          rsync -avz \
            -e "ssh -p ${DREAMHOST_PORT:-22}" \
            assets/logo.jpg \
            "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_WEB_ROOT/assets/logo.jpg"
          rsync -avz --delete \
            -e "ssh -p ${DREAMHOST_PORT:-22}" \
            whats-it-worth/dist/ \
            "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_WEB_ROOT/wiw/"
