<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e7" />
    <title>Welcome to the Cottage</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=31" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <img class="hero-logo" src="assets/logo.jpg" alt="Cottage welcome logo" />
        <p class="hero-contact">
          <span class="hero-contact-label">Contact:</span>
          <a href="tel:+15194279922">519 427 9922</a>
          <span class="hero-contact-separator" aria-hidden="true">|</span>
          <a href="mailto:rickyp3@me.com">rickyp3@me.com</a>
        </p>
        <p class="hero-kicker">Guest Information</p>
        <h1>Welcome to 64 Woodstock Ave Long Point Ontario</h1>
        <button class="tab hero-calendar-tab" type="button" data-tab="calendar">Availability Calendar</button>
        <p class="hero-callout">Your quick guide for arriving, settling in, and enjoying Long Point.</p>

        <div class="hero-meta">
          <div class="meta-card">
            <span class="meta-label">Date</span>
            <span id="todayDate" class="meta-value">-</span>
          </div>
          <div class="meta-card">
            <span class="meta-label">Time</span>
            <span id="clock" class="meta-value">-</span>
          </div>
          <div class="meta-card">
            <span class="meta-label">Guide checked</span>
            <span id="contentReviewed" class="meta-value">-</span>
          </div>
          <button id="textSizeToggle" class="meta-button" type="button">Large Text: Off</button>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Information categories">
        <button class="tab active" type="button" data-tab="start">Start Here</button>
        <button class="tab" type="button" data-tab="essentials">Essentials</button>
        <button class="tab" type="button" data-tab="businesses">Local Businesses</button>
        <button class="tab" type="button" data-tab="events">Local Events</button>
        <button class="tab" type="button" data-tab="rules">Cottage Rules</button>
        <button class="tab" type="button" data-tab="tips">Helpful Tips</button>
        <button class="tab" type="button" data-tab="checklist">Checklists</button>
      </nav>

      <section class="toolbar" aria-label="Search and filter">
        <label class="search-wrap" for="searchInput">
          <span>Search this section</span>
          <div class="search-input-row">
            <input id="searchInput" type="search" inputmode="text" autocomplete="off" placeholder="Search this section" />
            <button id="searchKeyboardToggle" class="keyboard-toggle-btn" type="button" aria-expanded="false">Touch Keyboard</button>
          </div>
        </label>
        <p class="hero-subtitle">Find the answer you need, then call, map, or check it in one tap.</p>
        <p id="searchStatus" class="search-status" aria-live="polite"></p>
        <div id="searchKeyboard" class="search-keyboard" hidden aria-hidden="true" aria-label="On-screen search keyboard">
          <div class="search-keyboard-row search-keyboard-row-numbers">
            <button type="button" class="search-key" data-key="1">1</button>
            <button type="button" class="search-key" data-key="2">2</button>
            <button type="button" class="search-key" data-key="3">3</button>
            <button type="button" class="search-key" data-key="4">4</button>
            <button type="button" class="search-key" data-key="5">5</button>
            <button type="button" class="search-key" data-key="6">6</button>
            <button type="button" class="search-key" data-key="7">7</button>
            <button type="button" class="search-key" data-key="8">8</button>
            <button type="button" class="search-key" data-key="9">9</button>
            <button type="button" class="search-key" data-key="0">0</button>
          </div>
          <div class="search-keyboard-row search-keyboard-row-top">
            <button type="button" class="search-key" data-key="q">Q</button>
            <button type="button" class="search-key" data-key="w">W</button>
            <button type="button" class="search-key" data-key="e">E</button>
            <button type="button" class="search-key" data-key="r">R</button>
            <button type="button" class="search-key" data-key="t">T</button>
            <button type="button" class="search-key" data-key="y">Y</button>
            <button type="button" class="search-key" data-key="u">U</button>
            <button type="button" class="search-key" data-key="i">I</button>
            <button type="button" class="search-key" data-key="o">O</button>
            <button type="button" class="search-key" data-key="p">P</button>
          </div>
          <div class="search-keyboard-row search-keyboard-row-middle">
            <button type="button" class="search-key" data-key="a">A</button>
            <button type="button" class="search-key" data-key="s">S</button>
            <button type="button" class="search-key" data-key="d">D</button>
            <button type="button" class="search-key" data-key="f">F</button>
            <button type="button" class="search-key" data-key="g">G</button>
            <button type="button" class="search-key" data-key="h">H</button>
            <button type="button" class="search-key" data-key="j">J</button>
            <button type="button" class="search-key" data-key="k">K</button>
            <button type="button" class="search-key" data-key="l">L</button>
          </div>
          <div class="search-keyboard-row search-keyboard-row-bottom">
            <button type="button" class="search-key" data-key="z">Z</button>
            <button type="button" class="search-key" data-key="x">X</button>
            <button type="button" class="search-key" data-key="c">C</button>
            <button type="button" class="search-key" data-key="v">V</button>
            <button type="button" class="search-key" data-key="b">B</button>
            <button type="button" class="search-key" data-key="n">N</button>
            <button type="button" class="search-key" data-key="m">M</button>
          </div>
          <div class="search-keyboard-row search-keyboard-row-actions">
            <button type="button" class="search-key search-key-wide" data-action="space">Space</button>
            <button type="button" class="search-key" data-action="backspace">Backspace</button>
            <button type="button" class="search-key" data-action="clear">Clear</button>
            <button type="button" class="search-key search-key-done" data-action="done">Done</button>
          </div>
        </div>
        <div id="filterChips" class="chips" aria-label="Section filters"></div>
      </section>

      <section id="contentArea" class="grid" aria-live="polite"></section>
    </main>

    <dialog id="detailDialog" class="detail-dialog" aria-labelledby="dialogTitle">
      <article>
        <header class="dialog-header">
          <h2 id="dialogTitle" tabindex="-1">Details</h2>
          <button id="closeDialog" class="close-btn" type="button" aria-label="Close">Close</button>
        </header>
        <div id="dialogBody" class="dialog-body"></div>
      </article>
    </dialog>

    <script src="data.js?v=31"></script>
    <script src="data.private.js?v=1"></script>
    <script src="app.js?v=32"></script>
  </body>
</html>
