plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cottageinfo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cottageinfo.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
